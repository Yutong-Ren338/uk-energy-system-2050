[project]
name = "uk-energy-modelling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.3",
    "mypy>=1.16.0",
    "numba>=0.61.2",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pint>=0.24.4",
    "pint-pandas>=0.7.1",
    "plotly>=6.2.0",
    "streamlit>=1.58.0",
    "ty>=0.0.1a19",
    "xarray[io]>=2025.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff==0.14.0",
    "pre-commit==4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 150
target-version = "py312"
preview = true
lint.select = ["ALL"]
lint.ignore = ["S", "D100", "D101", "D102", "D103",  "D104", "D105", "D106", "D107", "D205", "CPY001", "COM812", "T201", "N812", "N815", "N817", "EM101", "TRY003", "EM102", "PLR0914"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["INP001"]
"*.ipynb" = ["ERA001"]
"src/assumptions.py" = ["E501"]
"src/curtailment_lcoe.py" = ["DOC201"]
"src/data/ninja_2025_capacity_factors.py" = ["DOC201", "DOC501", "DOC502", "SIM118", "TC003"]
"src/data/renewable_capacity_factors.py" = ["D301", "DOC201"]
"src/ninja_2025_wind_plots.py" = ["ARG001", "DOC201", "PLR0911", "PLR0913", "RET504", "UP040"]
"src/power_system_core_no_h2.py" = ["ARG001", "DOC201"]
"src/power_system_no_h2.py" = ["DOC201"]
"src/scenarios.py" = ["D415", "DOC201", "DOC501", "PLR0913", "SIM108", "TC002"]
"tests/test_curtailment_lcoe.py" = ["PLC2701"]
"tests/test_supply_model.py" = ["ICN001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
